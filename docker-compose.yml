name: employee-management-system

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: employee-management-system-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "Employee Management System"
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: http://localhost:${APP_PORT:-8000}
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-employees_management}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      # Initial accounts (UserSeeder, fresh installs only). Empty ADMIN_PASSWORD: "password" when
      # APP_ENV=local, otherwise a random one printed once to the log. See README "Production settings".
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: docker/mysql
    image: employee-management-system-db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-employees_management}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # TCP is disabled while the init scripts (dataset import) run, so this
      # only passes once the import is finished and the real server is up.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e \"SELECT 1 FROM $$MYSQL_DATABASE.employees LIMIT 1\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15m

volumes:
  db-data:
