name: employee-management-system

# Settings shared by the web app, the queue worker and the scheduler.
x-app-environment: &app-environment
  APP_NAME: "Employee Management System"
  APP_ENV: ${APP_ENV:-local}
  # Must be the same in all three services: set it in .env.docker (docker-up does). Without it the
  # app's entrypoint generates a temporary key that the worker and the scheduler do not know.
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: "${APP_DEBUG:-false}"
  APP_URL: http://localhost:${APP_PORT:-8000}
  LOG_CHANNEL: stderr
  LOG_LEVEL: debug
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-employees_management}
  DB_USERNAME: ${DB_USERNAME:-laravel}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  SESSION_DRIVER: file
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
  # File cache on the shared volume `cache-data`: figures computed by the scheduler (reports:warm,
  # departments:warm) are read by the app, and a flush in the app reaches the others.
  CACHE_DRIVER: file
  # Large exports are generated by the `worker` service (jobs table). retry_after must be
  # longer than the worker's --timeout, otherwise a long export would be started twice.
  QUEUE_CONNECTION: database
  DB_QUEUE_RETRY_AFTER: 1900
  # Initial accounts (UserSeeder, fresh installs only). Empty ADMIN_PASSWORD: "password" when
  # APP_ENV=local, otherwise a random one printed once to the log. See README "Production settings".
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: employee-management-system-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    environment: *app-environment
    volumes:
      # Files of queued exports, written by the worker and downloaded through the app.
      - exports-data:/var/www/html/storage/app/exports
      - cache-data:/var/www/html/storage/framework/cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Healthy once the entrypoint has run the migrations and Apache answers.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/up"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5m

  # Queue worker: generates large exports ("My exports"). Same image as `app` (built there, so
  # never pulled), runs as www-data like Apache and without the app's entrypoint: the app
  # container runs the migrations, so the worker waits until it is healthy.
  worker:
    image: employee-management-system-app
    pull_policy: never
    restart: unless-stopped
    user: www-data
    entrypoint: ["php", "artisan"]
    command: ["queue:work", "--tries=1", "--timeout=1800", "--sleep=3", "--max-time=3600", "--memory=512"]
    environment: *app-environment
    volumes:
      - exports-data:/var/www/html/storage/app/exports
      - cache-data:/var/www/html/storage/framework/cache
    healthcheck:
      # The worker is the main process, so this checks what it depends on: boot and database.
      test: ["CMD-SHELL", "php artisan queue:failed >/dev/null"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy

  # Scheduler (routes/console.php): `reports:warm` and `departments:warm` hourly, `exports:prune` daily.
  scheduler:
    image: employee-management-system-app
    pull_policy: never
    restart: unless-stopped
    user: www-data
    entrypoint: ["php", "artisan"]
    command: ["schedule:work"]
    environment: *app-environment
    volumes:
      - exports-data:/var/www/html/storage/app/exports
      - cache-data:/var/www/html/storage/framework/cache
    depends_on:
      app:
        condition: service_healthy

  db:
    build:
      context: docker/mysql
    image: employee-management-system-db
    restart: unless-stopped
    # The default pool (128 MB) is much smaller than the dataset, so reports and department
    # figures would read most of it from disk on every run.
    command: ["--innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-1G}"]
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-employees_management}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # TCP is disabled while the init scripts (dataset import) run, so this
      # only passes once the import is finished and the real server is up.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e \"SELECT 1 FROM $$MYSQL_DATABASE.employees LIMIT 1\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15m

volumes:
  db-data:
  exports-data:
  cache-data:
